[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillward"
version = "0.1.0"
description = "Reference orchestrator for the Skillward Protocol: discover, verify, and execute remote skills through an authenticated gateway, with adapters for LangChain, LlamaIndex, CrewAI, AutoGen, Google ADK, and OpenAI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Skillward contributors" }]
keywords = ["agents", "llm", "langchain", "llamaindex", "crewai", "autogen", "tools", "skills", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "jsonschema>=4.26",
    "cryptography>=50.0",
]

[project.optional-dependencies]
# Each framework extra is intentionally independent. Do not install more
# than one of crewai/google-adk/autogen together in the same environment
# without checking for conflicts first: crewai (via chromadb) and google-adk
# pull in incompatible protobuf versions as of the versions available when
# this was written. Users installing one extra at a time (the normal case)
# are unaffected.
langchain = ["langchain-core>=1.6"]
llamaindex = ["llama-index-core>=0.12"]
crewai = ["crewai>=0.100"]
autogen = ["autogen-core>=0.4"]
google-adk = ["google-adk>=1.0"]
# openai_tool.py has no third-party dependency — it only builds plain dicts.
dev = ["pytest>=9.0", "PyYAML>=6.0", "fastapi>=0.141", "uvicorn[standard]>=0.53", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/rkuma238/skillward"
Specification = "https://github.com/rkuma238/skillward/blob/main/spec/SPEC.md"

[tool.setuptools.packages.find]
include = ["skillward", "skillward.*"]

[tool.pytest.ini_options]
# tests/test_end_to_end.py imports scripts.generate_envoy_config, which lives
# at the repo root, not inside the installed skillward package. `python -m
# pytest` happens to prepend cwd to sys.path and masks needing this; the
# plain `pytest` entry point (what CI and most people actually run) does not.
pythonpath = ["."]

[tool.ruff]
line-length = 115
target-version = "py311"
# Skill payload files reference __net_fetch__/__bundle__, globals the sandbox
# injects at execution time (see skillward/sandbox.py) — not real importable
# names, so linting these as ordinary project code just produces noise.
extend-exclude = ["examples/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines: black/manual wrapping already keeps things readable
